databases:
  - name: gtop-upgrade-db
    plan: free
    databaseName: gtop_upgrade
    user: gtop_upgrade_user

services:
  - type: web
    name: gtop-upgrade
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gtop-upgrade-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
