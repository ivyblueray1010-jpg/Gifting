    <div class="countdown-text" id="countdown">9 more spots left</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="question">How much do you need for your Business?</div>
    <div class="answer-container">
      <div class="answer-box" id="yesBox">500,000 Naira</div>
      <div class="answer-box" id="noBox">900,000 Naira</div>

  <!-- JavaScript remains unchanged -->
  <script>
    let selectedAnswer = null;
    const yesBox = document.getElementById('yesBox');
    const noBox = document.getElementById('noBox');
    const continueBtn = document.getElementById('continueBtn');
    let spotsLeft = 9;
    const countdownElement = document.getElementById('countdown');
    const progressFill = document.getElementById('progressFill');
    const congratMessage = document.getElementById('congratMessage');

    function selectAnswer(answer) {
      selectedAnswer = answer;
      if (answer === 'yes') {
        yesBox.classList.add('selected');
        noBox.classList.remove('selected');
      } else {
        noBox.classList.add('selected');
        yesBox.classList.remove('selected');
      }
      
      congratMessage.textContent = "Congrats! You qualify!";
      congratMessage.classList.add('active');

      continueBtn.disabled = false;
      continueBtn.classList.add('active');
    }

    yesBox.addEventListener('click', () => selectAnswer('yes'));
    noBox.addEventListener('click', () => selectAnswer('no'));

    continueBtn.addEventListener('click', () => {
      if (!selectedAnswer) return;
      continueBtn.textContent = 'PROCESSING...';
      continueBtn.classList.remove('active');
      continueBtn.classList.add('processing');
      continueBtn.disabled = true;

      const redirectUrls = [
        'https://blog.checkmepcobill.pk/how-to-buy-first-home-usa-2026-low-down-payment-closing-costs-fha-va-eligibility/',
        'https://blog.checkmepcobill.pk/how-to-buy-first-home-usa-2026-low-down-payment-closing-costs-fha-va-eligibility/',
        'https://blog.checkmepcobill.pk/how-to-buy-first-home-usa-2026-low-down-payment-closing-costs-fha-va-eligibility/',
        'https://blog.checkmepcobill.pk/how-to-buy-first-home-usa-2026-low-down-payment-closing-costs-fha-va-eligibility/',
        'https://blog.checkmepcobill.pk/how-to-buy-first-home-usa-2026-low-down-payment-closing-costs-fha-va-eligibility/',
      ];

      const randomUrl = redirectUrls[Math.floor(Math.random() * redirectUrls.length)];

      setTimeout(() => {
        window.location.href = randomUrl;
      }, 2000);
    });

    function updateCountdown() {
      if (spotsLeft > 1) {
        spotsLeft--;
        countdownElement.textContent = `${spotsLeft} more spots left`;
        const percentage = (spotsLeft / 9) * 100;
        progressFill.style.width = `${percentage}%`;

        if (spotsLeft <= 4) {
          countdownElement.style.color = '#D81B60';
          progressFill.style.background = '#D81B60';
        }

        if (spotsLeft === 1) {
          countdownElement.textContent = "1 more spot left";
          progressFill.style.width = "11.11%";
          clearInterval(timer);
        }
      }
    }

    countdownElement.textContent = "9 more spots left";
    progressFill.style.width = "100%";

    const timer = setInterval(updateCountdown, 2000);
  </script>
